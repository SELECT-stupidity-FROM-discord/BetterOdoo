name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config clang libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev libvulkan-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        shell: bash
        run: cargo build --locked --target ${{ matrix.target }} $([ "$RELEASE" = true ] && echo --release)

      - name: Package
        if: env.RELEASE == 'true'
        shell: bash
        run: |
          name="better-odoo-${GITHUB_REF_NAME}-${{ matrix.target }}"
          dir="target/${{ matrix.target }}/release"
          mkdir dist
          if [ "$RUNNER_OS" = Windows ]; then
            7z a "dist/$name.zip" "$dir/better-odoo.exe"
          else
            tar -czf "dist/$name.tar.gz" -C "$dir" better-odoo
          fi

      - uses: actions/upload-artifact@v4
        if: env.RELEASE == 'true'
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
