name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config clang libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev libvulkan-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        shell: bash
        run: cargo build --locked --target ${{ matrix.target }} $([ "$RELEASE" = true ] && echo --release)

      - name: Package (macOS .dmg)
        if: env.RELEASE == 'true' && runner.os == 'macOS'
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          mkdir dist
          packaging/macos/build-dmg.sh "target/${{ matrix.target }}/release/better-odoo" "$version" \
            "dist/better-odoo-${GITHUB_REF_NAME}-${{ matrix.target }}.dmg"

      - name: Package (Windows .msi)
        if: env.RELEASE == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install wixtoolset -y --no-progress
          $wix = (Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset*\bin" | Select-Object -First 1).FullName
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(\d+\.\d+\.\d+)').Matches[0].Groups[1].Value
          New-Item -ItemType Directory dist | Out-Null
          & "$wix\candle.exe" -nologo -arch x64 "-dVersion=$version" "-dExe=target\${{ matrix.target }}\release\better-odoo.exe" "-dIcon=assets\logo\icon.ico" -out wix.wixobj packaging\windows\main.wxs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$wix\light.exe" -nologo -out "dist\better-odoo-$env:GITHUB_REF_NAME-${{ matrix.target }}.msi" wix.wixobj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package (Linux .tar.gz)
        if: env.RELEASE == 'true' && runner.os == 'Linux'
        shell: bash
        run: |
          name="better-odoo-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/better-odoo" "dist/$name/"
          cp packaging/linux/better-odoo.desktop "dist/$name/"
          cp assets/logo/icon-512.png "dist/$name/better-odoo.png"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          rm -rf "dist/$name"

      - name: Package (Linux .AppImage)
        if: env.RELEASE == 'true' && runner.os == 'Linux'
        shell: bash
        run: |
          packaging/linux/build-appimage.sh "target/${{ matrix.target }}/release/better-odoo" \
            "dist/better-odoo-${GITHUB_REF_NAME}-${{ matrix.target }}.AppImage"

      - uses: actions/upload-artifact@v4
        if: env.RELEASE == 'true'
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
