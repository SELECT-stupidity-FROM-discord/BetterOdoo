[package]
name = "better-odoo"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "ed8dc1b6ca115f3ce70117ebb448dfb61ea030bf" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "ed8dc1b6ca115f3ce70117ebb448dfb61ea030bf", default-features = false, features = ["font-kit", "wayland", "x11"] }
ureq = { version = "3", features = ["json", "cookies"] }
serde_json = "1"
anyhow = "1"
unicode-segmentation = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSGraphics", "NSImage", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSGeometry", "NSHTTPCookie", "NSString", "NSURL", "NSURLRequest", "objc2-core-foundation"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
